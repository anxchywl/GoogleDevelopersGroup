name: gdg

services:
  web:
    image: ${GDG_IMAGE:?set to a ghcr.io/anxchywl/gdg-web image digest}
    # the shared caddy reaches this by container name, see Wished's Caddyfile.production
    container_name: gdg-web
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - proxy
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5

networks:
  proxy:
    name: wished_wished-app
    external: true
