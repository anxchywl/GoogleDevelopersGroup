name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  IMAGE: ghcr.io/${{ github.repository_owner }}/gdg-web

jobs:
  verify:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run verify
      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the container
        run: |
          docker compose -f docker/compose.production.yml config --quiet --no-interpolate
          docker run --rm "$IMAGE:latest" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run -d --name gdg-check --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:size=16m,mode=1777 -p 127.0.0.1:3080:8080 "$IMAGE:latest"
          curl --fail --silent --retry 15 --retry-all-errors --retry-delay 1 -o /dev/null http://127.0.0.1:3080/
          test "$(docker inspect -f '{{.Config.User}}' gdg-check)" = "10001:10001"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3080/)" = "405"
      - name: Remove test container
        if: always()
        run: docker rm -f gdg-check || true
      - name: Push image
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha

  deploy:
    name: Deploy
    needs: [verify, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://gdg.anxchywl.dev
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          # the job's own token expires with the run and can pull what this run pushed
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GDG_IMAGE: ${{ env.IMAGE }}@${{ needs.docker.outputs.digest }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          envs: REGISTRY_TOKEN,GITHUB_ACTOR,GDG_IMAGE,REPO_URL
          script: |
            set -eu
            path="${{ secrets.SSH_PATH }}"
            [ -d "$path/.git" ] || git clone --quiet "$REPO_URL" "$path"
            cd "$path"
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            trap 'docker logout ghcr.io >/dev/null' EXIT
            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            bash deploy/deploy.sh "$GDG_IMAGE"
